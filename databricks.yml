bundle:
  name: demo

resources:
  jobs:
    demo_job:
      name: demo_job
      tasks:
        - task_key: run_notebook
          notebook_task:
            notebook_path: ./notebooks/merge_into_scenerios
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-b889ed86-55c4.cloud.databricks.com